;
; OFM-Network -- Vorlage für Elternprojekte
;
; Diese Datei wird von OAM-Projekten über extra_configs eingebunden und ist
; bewusst wirkungslos: alles hier ist auskommentiert, damit sich für bestehende
; Projekte nichts ungefragt ändert. Übernimm, was du brauchst.
;

; ── Gleichzeitige Verbindungen (RP2040) ───────────────────────────────────────
;
; Ein Besucher belegt zwei Slots: den dauerhaft offenen WebSocket der Oberfläche
; und beim Seitenwechsel einen HTTP-Slot. Drei gleichzeitige Besucher brauchen also
; 6 Slots.
;
; Ohne das Flag unten bleibt der Default bei 3 Slots -- mehr kann der lwIP-PCB-Pool
; nicht tragen. Mit -D__LWIP_MEMMULT=2 hebt OFM-Network ihn von sich aus auf 6, ein
; zusätzliches OPENKNX_WEBSERVER_MAX_CONN ist dann nicht nötig.
;
; Der Grund: arduino-pico setzt
; MEMP_NUM_TCP_PCB = __LWIP_MEMMULT * 5, der Default sind also 5 aktive TCP-PCBs
; im *ganzen* Gerät -- inklusive MQTT, Webclient, OTA und der TIME_WAIT-Zustände
; frisch geschlossener Verbindungen. Mehr Slots als der Pool trägt liessen den
; letzten Accept still in lwIP scheitern -- deshalb der kleinere Default. Wer
; OPENKNX_WEBSERVER_MAX_CONN von Hand höher setzt als der Pool erlaubt, bekommt
; beim Bauen eine Warnung.
;
; __LWIP_MEMMULT=2 verdoppelt zugleich MEM_SIZE auf 32 KB und PBUF_POOL_SIZE auf
; 32 -- rund 16 KB mehr lwIP-Heap.
;
; [env]
; build_flags =
;   -D __LWIP_MEMMULT=2

; ── Feineinstellungen ─────────────────────────────────────────────────────────
;
; -D OPENKNX_WEBSERVER_MAX_CONN=6      ; HTTP und WS teilen sich diesen Vorrat
;                                     ; (nur nötig, um vom Default abzuweichen)
; -D OPENKNX_WEBSOCKET_TX_BUFFER=4096  ; Sendequeue, ein Ring für alle Clients
