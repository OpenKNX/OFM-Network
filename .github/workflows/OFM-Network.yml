name: OFM-check
run-name: Check OFM-Network Build

on: [push]

jobs:
  check:
    name: Check '${{ matrix.target }}' in '${{ matrix.oam }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - oam: OAM-Homematic
            prefix: HomematicGW
            # knxprod_xml: ...
            target: Release
          - oam: OAM-SmartHomeBridge
            prefix: SmartHomeBridge
            # knxprod_xml: ...
            target: Release

        # # [BUILD]: all build targets
        # target:
        #   - DFA16-Release
        # #  - ""
        #
        # # [REF]: same commit and (newest on) branch
        # # restore_branch:
        # #   - false
        # #   - true

    uses: ./.github/workflows/openknx-ofm-check.yml
    with:
      KNXPROD_PREFIX: ${{ matrix.prefix }}
      oam: ${{ matrix.oam }}
      target: ${{ matrix.target }}
      # restore_branch: ${{ matrix.restore_branch }}